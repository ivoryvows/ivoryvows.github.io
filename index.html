}

/* =========================================================

========================================================= */

section{

  width:100%;

  overflow:hidden;

    radial-gradient(circle at top left,rgba(255,255,255,.72),transparent 35%),

    linear-gradient(135deg,#fffdf7,#faf1df,#f3e3c3);
}

.section-title{
  text-align:center;
  margin-bottom:35px;
  position:relative;
  z-index:2;
}

.section-title h2{
  font-family:'Parisienne',cursive;
  font-size:58px;
  font-weight:400;
  color:#651b27;
  text-shadow:0 2px 12px rgba(101,27,39,.12);
}

.section-title p{
  margin-top:5px;
  font-family:'Cormorant Garamond',serif;
  font-size:21px;
  color:#8c6740;
  letter-spacing:1px;
}

/* =========================================================
   GOLD DREAMY SPARKLES
========================================================= */

#sparkCanvas,
#petalCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:999;
}

/* =========================================================
   OPENING
========================================================= */

#opening{
  position:fixed;
  inset:0;
  z-index:5000;
  background:#f8f0df;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  transition:opacity 1.2s ease,visibility 1.2s ease;
}

#opening.hide{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

#gatePoster{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

#gateVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  display:none;
  z-index:2;
}

#tapOverlay{
  position:absolute;
  bottom:10%;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  cursor:pointer;
  text-align:center;
  white-space:nowrap;
}

#tapOverlay span{
  font-family:'Parisienne',cursive;
  font-size:42px;
  color:#fffaf0;
  text-shadow:
    0 2px 8px rgba(0,0,0,.35),
    0 0 15px rgba(255,230,170,.8);
  animation:tapGlow 2s ease-in-out infinite;
}

@keyframes tapGlow{
  0%,100%{
    opacity:.75;
    transform:scale(1);
  }
  50%{
    opacity:1;
    transform:scale(1.05);
  }
}

========================================================= */

#welcome{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px 15px;
}

.welcome-frame{
  position:relative;
  width:min(100%,1000px);
  padding:10px;
  border:1px solid rgba(180,145,83,.75);
  background:rgba(255,252,243,.45);
  box-shadow:
    0 0 0 4px rgba(255,255,255,.55),
    0 0 0 6px rgba(181,143,76,.28),
    0 15px 45px rgba(101,27,39,.14);
}

.welcome-frame::before{
  content:"";

  inset:5px;
  border:1px solid rgba(181,143,76,.5);
  pointer-events:none;
  z-index:3;
}

.welcome-frame::after{
  content:"✦";

  top:-15px;
  left:50%;
  transform:translateX(-50%);
  font-size:23px;
  color:#b58f4c;
  background:#f8efdc;
  padding:0 12px;
  z-index:4;
}

.welcome-frame video{
  width:100%;
  display:block;
  max-height:85vh;
  object-fit:cover;
}

/* =========================================================
   SCRATCH
========================================================= */

#scratch{
  padding-top:70px;
  padding-bottom:70px;
}

.scratch-wrapper{
  position:relative;
  width:min(600px,94%);
  margin:auto;
  padding:12px;

  border:1px solid rgba(181,143,76,.75);
  background:
    linear-gradient(145deg,
      rgba(255,252,242,.9),
      rgba(248,238,214,.7));

  box-shadow:
    0 12px 40px rgba(101,27,39,.13),
    0 0 0 4px rgba(255,255,255,.45);
}

.scratch-wrapper::before{
  content:"";
  position:absolute;
  inset:5px;
  border:1px solid rgba(181,143,76,.48);
  pointer-events:none;
  z-index:5;
}

.scratch-wrapper::after{
  content:"✦";
  position:absolute;
  top:8px;
  right:13px;
  color:#b58f4c;
  font-size:17px;
  z-index:6;
}

/* opposite corner flowers */

.scratch-flower{
  position:absolute;
  width:72px;
  height:72px;
  object-fit:contain;
  z-index:8;
  pointer-events:none;
  filter:drop-shadow(0 3px 6px rgba(101,27,39,.15));
}

.scratch-flower.top-left{
  top:-25px;
  left:-25px;
  animation:flowerFloat 4s ease-in-out infinite;
}

.scratch-flower.bottom-right{
  bottom:-25px;
  right:-25px;
  animation:flowerFloat 4.5s ease-in-out infinite reverse;
}

@keyframes flowerFloat{
  0%,100%{
    transform:translateY(0) rotate(0deg);
  }
  50%{
    transform:translateY(-5px) rotate(2deg);
  }
}

.scratch-frame{
  position:relative;
  width:100%;
  overflow:hidden;
}

.scratch-frame iframe{
  width:100%;
  height:360px;
  border:0;
  display:block;
  background:transparent;
}
