<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ivory Vows</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background: #f7f2e9;
      color: #4b1820;
      font-family: Georgia, "Times New Roman", serif;
    }

    /* ==============================
       OPENING SCREEN
    ============================== */

    #opening {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background-image: url("Gatep.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* ==============================
       WELCOME VIDEO
       STAYS UNDER THE GATE
    ============================== */

    #welcomeVideo {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 1;
    }

    /* ==============================
       GATE VIDEO
    ============================== */

    #gateVideo {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      z-index: 2;

      background-image: url("Gatep.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      opacity: 1;

      transition: opacity 1.5s ease;
    }

    #gateVideo.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* ==============================
       TAP TO OPEN
       TEXT ONLY — NO BOX
    ============================== */

    #tapToOpen {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 10;

      background: transparent;
      border: none;
      outline: none;

      padding: 15px;

      color: #ffffff;

      font-family:
        "Snell Roundhand",
        "Brush Script MT",
        "Segoe Script",
        cursive;

      font-size: 36px;
      font-weight: normal;
      font-style: italic;

      letter-spacing: 1px;

      text-shadow:
        0 2px 6px rgba(0, 0, 0, 0.55),
        0 0 12px rgba(0, 0, 0, 0.25);

      cursor: pointer;

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    #tapToOpen.hide {
      opacity: 0;

      transform:
        translate(-50%, -50%)
        scale(0.95);

      pointer-events: none;
    }

    /* ==============================
       MAIN SCROLLING PAGE
    ============================== */

    main {
      width: 100%;

      background:
        radial-gradient(
          circle at top,
          rgba(255,255,255,0.85),
          transparent 45%
        ),
        #f7f2e9;
    }

    .section {
      width: 100%;

      padding: 80px 18px;

      text-align: center;
    }

    .section-title {
      margin-bottom: 20px;

      color: #641c27;

      font-size: 28px;

      letter-spacing: 2px;
    }

    .divider {
      width: 80px;
      height: 1px;

      margin:
        0 auto
        35px;

      background: #9b7b48;
    }

    .placeholder {
      width: 100%;
      max-width: 800px;

      min-height: 180px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px dashed rgba(100,28,39,0.25);

      color: #8a7474;

      font-size: 13px;

      letter-spacing: 1px;
    }

    /* ==============================
       FAMILY / DRESS VIDEOS
    ============================== */

    .content-video {
      display: block;

      width: 100%;
      max-width: 850px;

      height: auto;

      margin: 0 auto;
    }

    /* ==============================
       MOBILE
    ============================== */

    @media (max-width: 600px) {

      #tapToOpen {
        font-size: 31px;
      }

      .section {
        padding: 65px 16px;
      }

      .section-title {
        font-size: 25px;
      }
    }
  </style>
</head>


<body>


  <!-- =====================================
       OPENING
  ====================================== -->

  <section id="opening">


    <!--
      WELCOME VIDEO
      It is underneath the gate.
    -->

    <video
      id="welcomeVideo"
      src="welcome.mp4"
      muted
      playsinline
      loop
      preload="auto">
    </video>


    <!--
      GATE VIDEO
      Gatep.jpg is the visible poster.
    -->

    <video
      id="gateVideo"
      src="gate.mp4"
      poster="Gatep.jpg"
      muted
      playsinline
      preload="auto">
    </video>


    <!--
      TEXT ONLY
      NO BOX
    -->

    <button id="tapToOpen">
      Tap to Open
    </button>


  </section>



  <!-- =====================================
       SCROLLING INVITATION
  ====================================== -->

  <main>


    <!-- SCRATCH TO REVEAL -->

    <section
      class="section"
      id="scratch">

      <h2 class="section-title">
        A Little Surprise
      </h2>

      <div class="divider"></div>

      <div class="placeholder">
        SCRATCH TO REVEAL
      </div>

    </section>



    <!-- FAMILY VIDEO -->

    <section
      class="section"
      id="family">

      <video
        class="content-video"
        src="family.mp4"
        playsinline
        controls
        preload="metadata">
      </video>

    </section>



    <!-- COUNTDOWN -->

    <section
      class="section"
      id="countdown">

      <h2 class="section-title">
        Countdown
      </h2>

      <div class="divider"></div>

      <div class="placeholder">
        COUNTDOWN EMBED
      </div>

    </section>



    <!-- TIMELINE -->

    <section
      class="section"
      id="timeline">

      <h2 class="section-title">
        Timeline
      </h2>

      <div class="divider"></div>

      <div class="placeholder">
        TIMELINE
      </div>

    </section>



    <!-- VENUE -->

    <section
      class="section"
      id="venue">

      <h2 class="section-title">
        The Venue
      </h2>

      <div class="divider"></div>

      <div class="placeholder">
        VENUE PICTURE
      </div>

      <div style="height:40px;"></div>

      <div class="placeholder">
        MAP
      </div>

    </section>



    <!-- DRESS CODE -->

    <section
      class="section"
      id="dress">

      <video
        class="content-video"
        src="dress.mp4"
        playsinline
        controls
        preload="metadata">
      </video>

    </section>



    <!-- RSVP -->

    <section
      class="section"
      id="rsvp">

      <h2 class="section-title">
        RSVP
      </h2>

      <div class="divider"></div>

      <div class="placeholder">
        RSVP
      </div>

    </section>


  </main>



  <!-- =====================================
       JAVASCRIPT
  ====================================== -->

  <script>

    const gateVideo =
      document.getElementById("gateVideo");

    const welcomeVideo =
      document.getElementById("welcomeVideo");

    const tapToOpen =
      document.getElementById("tapToOpen");


    /* ==============================
       TAP TO OPEN
    ============================== */

    tapToOpen.addEventListener(
      "click",
      function () {

        /*
          Hide the cursive text
        */

        tapToOpen.classList.add("hide");


        /*
          Start Welcome video
        */

        welcomeVideo.play().catch(
          function () {}
        );


        /*
          Start Gate video
        */

        gateVideo.play().catch(
          function () {}

        );

      }
    );


    /* ==============================
       WHEN GATE FINISHES
    ============================== */

    gateVideo.addEventListener(
      "ended",
      function () {

        /*
          Fade the gate away
        */

        gateVideo.classList.add(
          "fade-out"
        );

      }
    );

  </script>


</body>
</html>
