<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ivory Vows</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
}

body {
  overflow-x: hidden;
  background: #f7f2e9;
}


/* =========================
   OPENING
========================= */

#opening {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100svh;
  overflow: hidden;
  background: #f7f2e9;
}


/* =========================
   GATE PICTURE
========================= */

#gatePicture {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center;

  z-index: 5;

  opacity: 1;

  transition: opacity 1.4s ease;
}


/* =========================
   WELCOME VIDEO
   UNDER EVERYTHING
========================= */

#welcomeVideo {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: 1;
}


/* =========================
   GATE VIDEO
========================= */

#gateVideo {
  position: absolute;
  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: 4;

  opacity: 0;

  transition: opacity 0.2s ease;
}


/* =========================
   TAP TO OPEN
========================= */

#tapToOpen {
  position: absolute;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);

  z-index: 10;

  border: none;
  outline: none;
  background: transparent;

  padding: 15px 20px;

  color: white;

  font-family:
    "Snell Roundhand",
    "Brush Script MT",
    "Segoe Script",
    cursive;

  font-size: 36px;
  font-style: italic;
  font-weight: normal;

  letter-spacing: 1px;

  cursor: pointer;

  text-shadow:
    0 2px 6px rgba(0,0,0,0.55),
    0 0 15px rgba(0,0,0,0.3);

  transition:
    opacity 0.8s ease,
    transform 0.8s ease;
}


#tapToOpen.hide {
  opacity: 0;

  transform:
    translate(-50%, -50%)
    scale(0.95);

  pointer-events: none;
}


/* =========================
   GATE PICTURE DISAPPEARS
========================= */

#gatePicture.hide {
  opacity: 0;
  pointer-events: none;
}


/* =========================
   GATE VIDEO APPEARS
========================= */

#gateVideo.playing {
  opacity: 1;
}


/* =========================
   MAIN INVITATION
========================= */

main {
  background:
    radial-gradient(
      circle at top,
      rgba(255,255,255,0.85),
      transparent 45%
    ),
    #f7f2e9;
}


.section {
  width: 100%;
  padding: 80px 18px;
  text-align: center;
}


.section-title {
  margin-bottom: 20px;

  color: #641c27;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size: 28px;
  letter-spacing: 2px;
}


.divider {
  width: 80px;
  height: 1px;

  margin:
    0 auto 35px;

  background: #9b7b48;
}


.placeholder {
  width: 100%;
  max-width: 800px;

  min-height: 180px;

  margin: auto;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px dashed rgba(100,28,39,0.25);

  color: #8a7474;

  font-size: 13px;

  letter-spacing: 1px;
}


.content-video {
  display: block;

  width: 100%;
  max-width: 850px;

  height: auto;

  margin: 0 auto;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

  #tapToOpen {
    font-size: 31px;
  }

  .section {
    padding: 65px 16px;
  }

  .section-title {
    font-size: 25px;
  }
}
</style>
</head>


<body>


<!-- =========================
     OPENING
========================= -->

<section id="opening">


  <!-- ACTUAL GATE PICTURE -->

  <img
    id="gatePicture"
    src="https://raw.githubusercontent.com/ivoryvows/ivoryvows.github.io/refs/heads/main/Gatep.jpg"
    alt="Wedding invitation"
  >


  <!-- WELCOME VIDEO UNDERNEATH -->

  <video
    id="welcomeVideo"
    src="welcome.mp4"
    muted
    playsinline
    loop
    preload="auto">
  </video>


  <!-- GATE VIDEO -->

  <video
    id="gateVideo"
    src="gate.mp4"
    muted
    playsinline
    preload="auto">
  </video>


  <!-- CURSIVE TEXT -->

  <button id="tapToOpen">
    Tap to Open
  </button>


</section>



<!-- =========================
     SCROLLING INVITATION
========================= -->

<main>


  <!-- SCRATCH -->

  <section
    class="section"
    id="scratch">

    <h2 class="section-title">
      A Little Surprise
    </h2>

    <div class="divider"></div>

    <div class="placeholder">
      SCRATCH TO REVEAL
    </div>

  </section>



  <!-- FAMILY -->

  <section
    class="section"
    id="family">

    <video
      class="content-video"
      src="family.mp4"
      playsinline
      controls
      preload="metadata">
    </video>

  </section>



  <!-- COUNTDOWN -->

  <section
    class="section"
    id="countdown">

    <h2 class="section-title">
      Countdown
    </h2>

    <div class="divider"></div>

    <div class="placeholder">
      COUNTDOWN EMBED
    </div>

  </section>



  <!-- TIMELINE -->

  <section
    class="section"
    id="timeline">

    <h2 class="section-title">
      Timeline
    </h2>

    <div class="divider"></div>

    <div class="placeholder">
      TIMELINE
    </div>

  </section>



  <!-- VENUE -->

  <section
    class="section"
    id="venue">

    <h2 class="section-title">
      The Venue
    </h2>

    <div class="divider"></div>

    <div class="placeholder">
      VENUE PICTURE
    </div>

    <div style="height:40px;"></div>

    <div class="placeholder">
      MAP
    </div>

  </section>



  <!-- DRESS CODE -->

  <section
    class="section"
    id="dress">

    <video
      class="content-video"
      src="dress.mp4"
      playsinline
      controls
      preload="metadata">
    </video>

  </section>



  <!-- RSVP -->

  <section
    class="section"
    id="rsvp">

    <h2 class="section-title">
      RSVP
    </h2>

    <div class="divider"></div>

    <div class="placeholder">
      RSVP
    </div>

  </section>


</main>



<script>

/* =========================
   ELEMENTS
========================= */

const gatePicture =
  document.getElementById("gatePicture");

const gateVideo =
  document.getElementById("gateVideo");

const welcomeVideo =
  document.getElementById("welcomeVideo");

const tapToOpen =
  document.getElementById("tapToOpen");


/* =========================
   TAP TO OPEN
========================= */

tapToOpen.addEventListener(
  "click",
  function() {

    /* Hide text */

    tapToOpen.classList.add("hide");


    /* Start Welcome underneath */

    welcomeVideo.play().catch(
      function() {}
    );


    /*
      Start Gate video
    */

    gateVideo.currentTime = 0;

    gateVideo.classList.add("playing");

    gateVideo.play().catch(
      function() {}
    );


    /*
      Remove the picture
      so gate video takes over
    */

    setTimeout(
      function() {

        gatePicture.classList.add("hide");

      },
      150
    );

  }
);


/* =========================
   GATE FINISHES
========================= */

gateVideo.addEventListener(
  "ended",
  function() {

    /*
      Gate video fades away
    */

    gateVideo.style.opacity = "0";

  }
);

</script>


</body>
</html>
