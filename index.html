<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Ivory Vows</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  overflow-x:hidden;
  background:#f7f2e9;
}


/* =========================
   OPENING
========================= */

#opening{
  position:relative;

  width:100%;
  height:100vh;
  height:100svh;

  overflow:hidden;

  background:#f7f2e9;
}


/* =========================
   WELCOME
========================= */

#welcomeVideo{

  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:1;
}


/* =========================
   GATE VIDEO
========================= */

#gateVideo{

  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:5;

  opacity:0;

  pointer-events:none;

  transition:opacity 0.2s ease;

}


/* =========================
   GATE PICTURE
========================= */

#gatePicture{

  position:absolute;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;
  object-position:center;

  z-index:6;

  transition:opacity 1.3s ease;

}


/* =========================
   TAP TO OPEN
========================= */

#tapToOpen{

  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:10;

  background:transparent;

  border:none;
  outline:none;

  padding:15px 20px;

  color:#fff;

  font-family:
    "Snell Roundhand",
    "Brush Script MT",
    "Segoe Script",
    cursive;

  font-size:36px;

  font-style:italic;

  font-weight:normal;

  letter-spacing:1px;

  cursor:pointer;

  text-shadow:
    0 2px 7px rgba(0,0,0,.6),
    0 0 15px rgba(0,0,0,.3);

  transition:
    opacity .8s ease,
    transform .8s ease;

}


#tapToOpen.hide{

  opacity:0;

  transform:
    translate(-50%,-50%)
    scale(.95);

  pointer-events:none;

}


/* =========================
   MAIN PAGE
========================= */

main{

  background:
    radial-gradient(
      circle at top,
      rgba(255,255,255,.85),
      transparent 45%
    ),
    #f7f2e9;

}


.section{

  width:100%;

  padding:80px 18px;

  text-align:center;

}


.section-title{

  margin-bottom:20px;

  color:#641c27;

  font-family:
    Georgia,
    "Times New Roman",
    serif;

  font-size:28px;

  letter-spacing:2px;

}


.divider{

  width:80px;

  height:1px;

  margin:
    0 auto 35px;

  background:#9b7b48;

}


.placeholder{

  width:100%;

  max-width:800px;

  min-height:180px;

  margin:auto;

  display:flex;

  align-items:center;

  justify-content:center;

  border:1px dashed
    rgba(100,28,39,.25);

  color:#8a7474;

  font-size:13px;

  letter-spacing:1px;

}


.content-video{

  display:block;

  width:100%;

  max-width:850px;

  height:auto;

  margin:0 auto;

}


@media(max-width:600px){

  #tapToOpen{
    font-size:31px;
  }

  .section{
    padding:65px 16px;
  }

  .section-title{
    font-size:25px;
  }

}

</style>

</head>


<body>


<!-- =========================
     OPENING
========================= -->

<section id="opening">


<img
  id="gatePicture"
  src="https://raw.githubusercontent.com/ivoryvows/ivoryvows.github.io/refs/heads/main/Gatep.jpg"
  alt="Wedding Gate">


<video
  id="welcomeVideo"
  src="welcome.mp4"
  muted
  playsinline
  loop
  preload="auto">
</video>


<video
  id="gateVideo"
  src="gate.MP4"
  muted
  playsinline
  preload="auto">
</video>


<button id="tapToOpen">
  Tap to Open
</button>


</section>



<!-- =========================
     SCROLLING INVITATION
========================= -->

<main>


<section
  class="section"
  id="scratch">

  <h2 class="section-title">
    A Little Surprise
  </h2>

  <div class="divider"></div>

  <div class="placeholder">
    SCRATCH TO REVEAL
  </div>

</section>



<section
  class="section"
  id="family">

  <video
    class="content-video"
    src="family.mp4"
    playsinline
    controls
    preload="metadata">
  </video>

</section>



<section
  class="section"
  id="countdown">

  <h2 class="section-title">
    Countdown
  </h2>

  <div class="divider"></div>

  <div class="placeholder">
    COUNTDOWN EMBED
  </div>

</section>



<section
  class="section"
  id="timeline">

  <h2 class="section-title">
    Timeline
  </h2>

  <div class="divider"></div>

  <div class="placeholder">
    TIMELINE
  </div>

</section>



<section
  class="section"
  id="venue">

  <h2 class="section-title">
    The Venue
  </h2>

  <div class="divider"></div>

  <div class="placeholder">
    VENUE PICTURE
  </div>

  <div style="height:40px;"></div>

  <div class="placeholder">
    MAP
  </div>

</section>



<section
  class="section"
  id="dress">

  <video
    class="content-video"
    src="dress.mp4"
    playsinline
    controls
    preload="metadata">
  </video>

</section>



<section
  class="section"
  id="rsvp">

  <h2 class="section-title">
    RSVP
  </h2>

  <div class="divider"></div>

  <div class="placeholder">
    RSVP
  </div>

</section>


</main>



<script>


const tapToOpen =
  document.getElementById("tapToOpen");

const gatePicture =
  document.getElementById("gatePicture");

const gateVideo =
  document.getElementById("gateVideo");

const welcomeVideo =
  document.getElementById("welcomeVideo");


/* =========================
   TAP
========================= */

tapToOpen.addEventListener(
  "click",
  async function(){

    /*
      Because this function is triggered
      directly by the user's tap,
      Safari allows video playback.
    */

    try{

      gateVideo.currentTime = 0;

      await gateVideo.play();

      /*
        Gate successfully started.
        Now hide the picture.
      */

      gatePicture.style.opacity = "0";

      gateVideo.style.opacity = "1";

      tapToOpen.classList.add("hide");


      /*
        Start welcome underneath.
      */

      welcomeVideo.play().catch(
        function(){}
      );

    }

    catch(error){

      /*
        If Safari doesn't start the video,
        keep the gate picture visible.
      */

      console.log(
        "Gate video could not start:",
        error
      );

    }

  }
);


/* =========================
   GATE FINISHES
========================= */

gateVideo.addEventListener(
  "ended",
  function(){

    gateVideo.style.opacity = "0";

  }
);

</script>


</body>
</html>
