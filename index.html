<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ivory Vows</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f7f2e9;
      color: #4b1820;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    /* =========================
       OPENING
    ========================= */

    #opening {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      overflow: hidden;
      background: #f7f2e9;
    }

    /* Welcome video stays underneath */

    #welcomeVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Gate video */

    #gateVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 2;

      opacity: 1;
      transition: opacity 1.5s ease;
    }

    #gateVideo.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* =========================
       TAP TO OPEN
       NO BOX
    ========================= */

    #tapToOpen {
      position: absolute;
      z-index: 10;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      background: transparent;
      border: none;
      outline: none;

      padding: 12px 20px;

      color: #fff;

      font-family:
        "Snell Roundhand",
        "Brush Script MT",
        "Segoe Script",
        cursive;

      font-size: 34px;
      font-style: italic;
      font-weight: 400;

      letter-spacing: 1px;

      cursor: pointer;

      text-shadow:
        0 2px 5px rgba(0,0,0,0.45),
        0 0 14px rgba(255,255,255,0.2);

      transition:
        opacity 0.8s ease,
        transform 0.8s ease;
    }

    #tapToOpen.hide {
      opacity: 0;

      transform:
        translate(-50%, -50%)
        scale(0.96);

      pointer-events: none;
    }

    /* =========================
       SCROLLING INVITATION
    ========================= */

    main {
      position: relative;

      background:
        radial-gradient(
          circle at top,
          rgba(255,255,255,0.8),
          transparent 45%
        ),
        #f7f2e9;
    }

    .section {
      position: relative;

      width: 100%;

      padding: 75px 18px;

      text-align: center;
    }

    .section-title {
      margin-bottom: 22px;

      color: #641c27;

      font-size: 28px;

      letter-spacing: 2px;
    }

    .divider {
      width: 80px;
      height: 1px;

      margin:
        0 auto
        35px;

      background: #9b7b48;
    }

    /* =========================
       PLACEHOLDERS
    ========================= */

    .placeholder {
      width: 100%;
      max-width: 800px;

      min-height: 180px;

      margin: 0 auto;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px dashed rgba(100, 28, 39, 0.28);

      color: #8a7474;

      font-size: 13px;

      letter-spacing: 1px;
    }

    /* =========================
       VIDEOS
    ========================= */

    .content-video {
      display: block;

      width: 100%;
      max-width: 850px;

      height: auto;

      margin: 0 auto;

      border-radius: 0;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      #tapToOpen {
        font-size: 30px;
      }

      .section {
        padding: 65px 16px;
      }

      .section-title {
        font-size: 25px;
      }
    }
  </style>
</head>


<body>


  <!-- =================================
       OPENING
  ================================== -->

  <section id="opening">

    <!--
      WELCOME VIDEO
      This stays underneath the gate.
    -->

    <video
      id="welcomeVideo"
      src="welcome.mp4"
      muted
      playsinline
      loop
      preload="auto">
    </video>


    <!--
      GATE VIDEO
      gatep.jpg is shown before the tap.
    -->

    <video
      id="gateVideo"
      src="gate.mp4"
      poster="gatep.jpg"
      muted
      playsinline
      preload="auto">
    </video>


    <!--
      TEXT ONLY
      NO BOX
    -->

    <button id="tapToOpen">
      Tap to Open
    </button>

  </section>



  <!-- =================================
       MAIN SCROLLING INVITATION
  ================================== -->

  <main>


    <!-- SCRATCH -->

    <section
      class="section"
      id="scratch">

      <h2 class="section-title">
        A Little Surprise
      </h2>

      <div class="divider"></div>

      <div class="placeholder">
        SCRATCH TO REVEAL
      </div>

    </section>



    <!-- FAMILY VIDEO -->

    <section
      class="section"
      id="family">

      <video
        class="content-video"
        src="family.mp4"
        playsinline
        controls
        preload="metadata">
      </video>

    </section>



    <!-- COUNTDOWN -->

    <section
      class="section"
      id="countdown">

      <h2 class="section-title">
        Countdown
      </h2>

      <div class="divider"></div>

      <div class="placeholder">
        COUNTDOWN EMBED
      </div>

    </section>



    <!-- TIMELINE -->

    <section
      class="section"
      id="timeline">

      <h2 class="section-title">
        Timeline
      </h2>

      <div class="divider"></div>

      <div class="placeholder">
        TIMELINE
      </div>

    </section>



    <!-- VENUE -->

    <section
      class="section"
      id="venue">

      <h2 class="section-title">
        The Venue
      </h2>

      <div class="divider"></div>

      <div class="placeholder">
        VENUE PICTURE
      </div>

      <div style="height:40px;"></div>

      <div class="placeholder">
        MAP
      </div>

    </section>



    <!-- DRESS CODE -->

    <section
      class="section"
      id="dress">

      <video
        class="content-video"
        src="dress.mp4"
        playsinline
        controls
        preload="metadata">
      </video>

    </section>



    <!-- RSVP -->

    <section
      class="section"
      id="rsvp">

      <h2 class="section-title">
        RSVP
      </h2>

      <div class="divider"></div>

      <div class="placeholder">
        RSVP
      </div>

    </section>


  </main>



  <!-- =================================
       JAVASCRIPT
  ================================== -->

  <script>

    const gateVideo =
      document.getElementById("gateVideo");

    const welcomeVideo =
      document.getElementById("welcomeVideo");

    const tapToOpen =
      document.getElementById("tapToOpen");


    /*
      USER TAPS
    */

    tapToOpen.addEventListener(
      "click",
      function () {

        /* Hide Tap to Open */

        tapToOpen.classList.add("hide");


        /*
          Start Welcome video
          underneath the gate
        */

        welcomeVideo.play().catch(
          function () {}
        );


        /*
          Start Gate video
        */

        gateVideo.play().catch(
          function () {}
        );

      }
    );


    /*
      GATE FINISHES
    */

    gateVideo.addEventListener(
      "ended",
      function () {

        /*
          Fade gate away
        */

        gateVideo.classList.add(
          "fade-out"
        );

      }
    );

  </script>


</body>
</html>
